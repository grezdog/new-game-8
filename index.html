<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angry Rabbits: Meme Mayhem</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:10px}
h1{font-size:clamp(23px,4vw,34px);margin:5px}
#info{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-weight:bold;margin:12px}
canvas{display:block;width:min(100%,1000px);height:auto;margin:auto;border:3px solid white;border-radius:8px;touch-action:none}
button{margin:5px;padding:11px 16px;border:0;border-radius:8px;background:#facc15;color:#111;font-weight:bold;font-size:15px;cursor:pointer}
#message{min-height:25px;padding:8px;font-weight:bold}
small{display:block;padding:0 10px 15px;color:#cbd5e1}
</style>
</head>
<body>
<header>
<h1>🐰 Angry Rabbits: Meme Mayhem</h1>
<div id="info">
<span id="levelLabel">Level 1 / 50</span>
<span id="tries">Tries: 5 / 5</span>
<span id="score">Score: 0</span>
</div>
</header>

<canvas id="game" width="1000" height="560"></canvas>
<div>
<button id="reset">🔄 Restart Level</button>
<button id="next">➡️ Next Level</button>
<button id="aimButton">🎯 Show Aim: ON</button>
<label style="display:inline-block;margin:5px 10px;font-weight:bold">💪 Power <input type="range" id="power" min="40" max="200" value="100" style="vertical-align:middle;width:150px"> <span id="powerVal">100%</span></label>
</div>
<div id="message">Pull the rabbit backward and release to launch!</div>
<small>Pull the rabbit in any direction (360°) - farther back means a more powerful shot. Hit the towers to knock them over!</small>

<script>
(()=>{
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=1000,H=560,GROUND=495,GRAVITY=650;
const STEP=1/120;      // fixed physics step (aim line uses the same one)
const POWER=14;        // launch speed per pixel pulled  <-- raise for even farther shots
const MAXPULL=125;     // max pull distance in pixels
const MU=0.55;         // friction
const sling={x:125,y:GROUND-38};

const themes=[
["Doge World","#83d7ff","#ffe9a8","VERY WOW"],
["Among Us","#372b60","#e45a77","SUS RABBITS"],
["Stonks City","#62c8a5","#e9f2b0","TO THE MOON"],
["Galaxy Brain","#17123f","#aa7aff","BIG BRAIN TIME"],
["Backrooms","#d6d1a3","#fff0c0","WHERE ARE WE?"],
["Banana Dimension","#ffdf45","#fff6b0","BANANA MODE"],
["Pixel Paradise","#39c4b7","#a5f3fc","8-BIT MAYHEM"],
["Meme Mountain","#79b9ff","#e5f5ff","MAXIMUM MEME"],
["Rescue City","#ffb86b","#ffe3a3","CITY RESCUE"],
["Cat Internet","#ffb4d5","#fff0f7","MEOW MAYHEM"],
["Rainbow Road","#e8a2ff","#fff1b8","RAINBOW POWER"],
["Desert Doge","#efb56e","#ffe6a6","MUCH DESERT"],
["Frog Pond","#74d69a","#c6f6a8","RIBBIT MODE"],
["Ice Cream Planet","#a3e7ff","#ffe0f0","BRAIN FREEZE"],
["Space Station","#20264c","#98d7ff","RABBIT ASTRONAUT"],
["Jungle Meme","#45ae75","#d4f59a","JUNGLE CHAOS"],
["Volcano Valley","#7f3343","#ffb06a","HOT MEMES"],
["Candy Kingdom","#f4a5d7","#fff0a8","SWEET VICTORY"],
["Robot Factory","#64748b","#cbd5e1","BEEP BOOP"],
["Ocean Internet","#1679ad","#8de9f5","DEEP MEMES"],
["Haunted Mansion","#30244e","#a9a1d6","SPOOKY BUNNY"],
["Disco Fever","#6c43b7","#ffda71","DANCE MODE"],
["Cloud Kingdom","#a6d8ff","#fff","CLOUD NINE"],
["Lava Planet","#8d3030","#ffc15e","LAVA HOP"],
["Jelly World","#61c8c5","#d1fff3","VERY JIGGLY"],
["Toy Box","#ed9d55","#fff0b5","PLAYTIME"],
["Neon City","#111a48","#39f5e9","NEON SPEED"],
["Mushroom Forest","#66945d","#e5c6ff","MUSHROOM POWER"],
["Moon Base","#505b82","#dce6ff","ONE SMALL HOP"],
["Watermelon World","#59b76e","#ff9f9f","JUICY MEMES"],
["Volleyball Beach","#63c9ed","#fff3b2","BEACH BALL"],
["Giant Arcade","#29285f","#ff75c3","INSERT COIN"],
["Crystal Cave","#51408c","#b9f7ff","SHINY STUFF"],
["Snow Day","#b8e7ff","#fff","SNOW WAY"],
["Supermarket","#e4b65e","#f8e7a2","SHOPPING CART"],
["Pirate Island","#268c9c","#ffe0a0","ARRR YOU READY"],
["Farm Frenzy","#8ccf71","#fff0ae","FARM FRENZY"],
["Skate Park","#f49d55","#c8f5ff","RADICAL RABBITS"],
["Music Planet","#503f93","#ffa7df","DROP THE BEAT"],
["Lemon Galaxy","#293d8a","#fff17a","SOUR POWER"],
["Haunted Arcade","#412e68","#a9fff0","GHOST MODE"],
["Dinosaur Valley","#75ae61","#ffd18d","PREHISTORIC LOL"],
["Gummy Galaxy","#5544a8","#ffb6e6","GUMMY TIME"],
["Space Carnival","#403b91","#ffd166","STEP RIGHT UP"],
["Mountain Meme","#7394a9","#f0f7ff","PEAK PERFORMANCE"],
["Flower Planet","#73bf82","#ffc9ec","FLOWER POWER"],
["Cyber Forest","#1b6359","#76ffe0","CYBER HOP"],
["Dream Dimension","#8075ca","#ffddfb","DREAM BIG"],
["Golden Meme Land","#d6a62e","#fff1a1","GOLDEN BUNNY"],
["Final Meme Boss","#292044","#ffcb69","ULTIMATE MAYHEM"]
];

let level=1,shots=5,score=0,aimOn=true;
let rabbit=null;      // rabbit waiting on the sling
let rb=null;          // launched rabbit (physics body)
let bodies=[],particles=[];
let dragging=false,won=false,gameOver=false,lastTime=0,acc=0,wait=0;
let dragOffsetX=0,dragOffsetY=0,powerScale=1;

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
const msg=t=>$("message").textContent=t;

/* ---------------- PHYSICS BODIES ---------------- */
const DENS={wood:.0009,carrot:.0007,building:.0016,hawk:.0016,rabbit:.0045};
const HP={wood:200,carrot:80,building:500,hawk:1,rabbit:1e9};
const GND={im:0,ii:0,vx:0,vy:0,av:0,x:0,y:GROUND,hp:1e9,m:1e9,kind:"ground"};

function mk(o){
 const b=Object.assign({a:0,vx:0,vy:0,av:0,age:0},o);
 b.hp=HP[b.kind];
 const area=b.t==="c"?Math.PI*b.r*b.r:b.w*b.h;
 b.m=area*DENS[b.kind];
 b.I=b.t==="c"?.5*b.m*b.r*b.r:b.m*(b.w*b.w+b.h*b.h)/12;
 b.im=1/b.m;b.ii=1/b.I;
 bodies.push(b);return b;
}
const addBox=(x,y,w,h,kind)=>mk({t:"b",x,y,w,h,kind});
const addHawk=(x,y)=>mk({t:"c",x,y,r:17,kind:"hawk"});

function makeRabbit(){rabbit={x:sling.x,y:sling.y,r:17};}

function buildLevel(n){
 level=clamp(n,1,50);shots=5;won=false;gameOver=false;wait=0;
 dragging=false;bodies=[];particles=[];rb=null;
 makeRabbit();

 if(level===9){
  for(let i=0;i<5;i++){
   const h=85+(i%2)*35,cx=582+i*88,top=GROUND-h-.2;
   addBox(cx,GROUND-h/2-.2,65,h,"building");
   addBox(cx,top-8.3,70,16,"building");
   if(i%2===0)addHawk(cx,top-16.6-17.3);
  }
 }else{
  const count=Math.min(2+Math.floor((level-1)/5),5);
  const number=Math.min(1+Math.floor((level-1)/3),5);
  const tops=[];
  for(let t=0;t<count;t++){
   const cx=579+t*78,height=2+((level+t)%3);
   for(let row=0;row<height;row++)addBox(cx,GROUND-15.2-row*30.4,58,30,"wood");
   let top=GROUND-height*30.4;
   if(height>=3){addBox(cx,top-11.3,42,22,"carrot");top-=22.6;}
   tops.push(top);
  }
  for(let i=0;i<number;i++){
   if(i<count)addHawk(579+i*78,tops[i]-17.5);
   else addHawk(579+count*78+(i-count)*44,GROUND-17.5);
  }
 }
 loadBg(level);loadBg(Math.min(level+1,50));
 updateUI();
 msg("Pull the rabbit backward and release to launch!");
}

function updateUI(){
 $("levelLabel").textContent=`Level ${level} / 50`;
 $("tries").textContent=`Tries: ${shots} / 5`;
 $("score").textContent=`Score: ${score}`;
}

/* ---------------- INPUT ---------------- */
function pos(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}

canvas.addEventListener("pointerdown",e=>{
 if(won||gameOver||!rabbit||shots<=0)return;
 const p=pos(e);
 if(Math.hypot(p.x-rabbit.x,p.y-rabbit.y)<55){
  dragging=true;
  dragOffsetX=p.x-rabbit.x;dragOffsetY=p.y-rabbit.y;
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
 }
});

canvas.addEventListener("pointermove",e=>{
 if(!dragging)return;
 const p=pos(e);
 let dx=p.x-dragOffsetX-sling.x,dy=p.y-dragOffsetY-sling.y;
 const len=Math.hypot(dx,dy);
 if(len>MAXPULL){dx*=MAXPULL/len;dy*=MAXPULL/len;}
 rabbit.x=sling.x+dx;
 rabbit.y=sling.y+dy;
 e.preventDefault();
});

function launchRabbit(){
 if(!dragging)return;
 dragging=false;
 const dx=sling.x-rabbit.x,dy=sling.y-rabbit.y;
 if(Math.hypot(dx,dy)<8){makeRabbit();return;}
 rb=mk({t:"c",x:sling.x,y:sling.y,r:17,kind:"rabbit",vx:dx*POWER*powerScale,vy:dy*POWER*powerScale});
 rabbit=null;shots--;wait=0;
 updateUI();
 msg("YEET! LET THAT BUNNY FLY!");
}
canvas.addEventListener("pointerup",launchRabbit);
canvas.addEventListener("pointercancel",launchRabbit);

$("reset").onclick=()=>buildLevel(level);
$("next").onclick=()=>buildLevel(level===50?1:level+1);
$("power").oninput=e=>{powerScale=e.target.value/100;$("powerVal").textContent=e.target.value+"%";};
$("aimButton").onclick=()=>{
 aimOn=!aimOn;
 $("aimButton").textContent=`🎯 Show Aim: ${aimOn?"ON":"OFF"}`;
};

function burst(x,y,color){
 for(let i=0;i<8;i++)particles.push({x,y,vx:rand(-130,130),vy:rand(-180,30),life:rand(.3,.7),color});
}

/* ---------------- COLLISION DETECTION ---------------- */
const radius=b=>b.t==="c"?b.r:Math.hypot(b.w,b.h)/2;

function verts(b){
 const c=Math.cos(b.a),s=Math.sin(b.a),hw=b.w/2,hh=b.h/2;
 return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y])=>({x:b.x+x*c-y*s,y:b.y+x*s+y*c}));
}
function inside(b,v){
 const c=Math.cos(b.a),s=Math.sin(b.a),dx=v.x-b.x,dy=v.y-b.y;
 return Math.abs(dx*c+dy*s)<=b.w/2+1&&Math.abs(-dx*s+dy*c)<=b.h/2+1;
}

// every function returns contacts with the normal pointing from A to B
function cc(A,B){
 const dx=B.x-A.x,dy=B.y-A.y,r=A.r+B.r,d2=dx*dx+dy*dy;
 if(d2>=r*r)return [];
 const d=Math.sqrt(d2)||1e-4,nx=d2?dx/d:0,ny=d2?dy/d:-1;
 return [{x:A.x+nx*A.r,y:A.y+ny*A.r,nx,ny,d:r-d}];
}
function cb(C,B){ // normal from circle C to box B
 const c=Math.cos(B.a),s=Math.sin(B.a),dx=C.x-B.x,dy=C.y-B.y;
 const lx=dx*c+dy*s,ly=-dx*s+dy*c,hw=B.w/2,hh=B.h/2;
 const qx=clamp(lx,-hw,hw),qy=clamp(ly,-hh,hh);
 const ex=lx-qx,ey=ly-qy,d2=ex*ex+ey*ey;
 if(d2>C.r*C.r)return [];
 let nx,ny,pen,px=qx,py=qy;
 if(d2>1e-8){const d=Math.sqrt(d2);nx=ex/d;ny=ey/d;pen=C.r-d;}
 else{
  const ox=hw-Math.abs(lx),oy=hh-Math.abs(ly);
  if(ox<oy){nx=lx<0?-1:1;ny=0;pen=ox+C.r;px=nx*hw;py=ly;}
  else{nx=0;ny=ly<0?-1:1;pen=oy+C.r;px=lx;py=ny*hh;}
 }
 const wx=nx*c-ny*s,wy=nx*s+ny*c;
 return [{x:B.x+px*c-py*s,y:B.y+px*s+py*c,nx:-wx,ny:-wy,d:pen}];
}
function bb(A,B){
 const va=verts(A),vb=verts(B);
 let best=1e9,bn=null;
 for(const P of [A,B]){
  const c=Math.cos(P.a),s=Math.sin(P.a);
  for(const ax of [[c,s],[-s,c]]){
   let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
   for(const v of va){const p=v.x*ax[0]+v.y*ax[1];a0=Math.min(a0,p);a1=Math.max(a1,p);}
   for(const v of vb){const p=v.x*ax[0]+v.y*ax[1];b0=Math.min(b0,p);b1=Math.max(b1,p);}
   const o=Math.min(a1,b1)-Math.max(a0,b0);
   if(o<=0)return [];
   if(o<best){best=o;bn=ax;}
  }
 }
 let nx=bn[0],ny=bn[1];
 if((B.x-A.x)*nx+(B.y-A.y)*ny<0){nx=-nx;ny=-ny;}
 const out=[];
 for(const v of va)if(inside(B,v))out.push({x:v.x,y:v.y,nx,ny,d:best});
 for(const v of vb)if(inside(A,v))out.push({x:v.x,y:v.y,nx,ny,d:best});
 if(!out.length)out.push({x:(A.x+B.x)/2,y:(A.y+B.y)/2,nx,ny,d:best});
 out.forEach(c=>c.d/=out.length);
 return out;
}
function collide(A,B){
 if(A.t==="c"&&B.t==="c")return cc(A,B);
 if(A.t==="c")return cb(A,B);
 if(B.t==="c")return cb(B,A).map(c=>({...c,nx:-c.nx,ny:-c.ny}));
 return bb(A,B);
}

/* ---------------- DAMAGE ---------------- */
function dmg(X,Y,s){
 if(X.hp>=1e8)return;
 const thr=X.kind==="hawk"?130:170;
 if(s<=thr)return;
 const f=Y.im===0?.5:Math.min(2,Y.m/X.m*.8+.3);
 X.hp-=(s-thr)*f*(X.kind==="hawk"?1:.3);
}

/* ---------------- PHYSICS STEP ---------------- */
function applyImp(c,px,py){
 const {A,B}=c;
 A.vx-=px*A.im;A.vy-=py*A.im;A.av-=(c.rax*py-c.ray*px)*A.ii;
 B.vx+=px*B.im;B.vy+=py*B.im;B.av+=(c.rbx*py-c.rby*px)*B.ii;
}
function relVel(c){
 const {A,B}=c;
 return [B.vx-B.av*c.rby-(A.vx-A.av*c.ray),B.vy+B.av*c.rbx-(A.vy+A.av*c.rax)];
}

function step(){
 for(const b of bodies)b.vy+=GRAVITY*STEP;

 const cs=[];
 for(let i=0;i<bodies.length;i++){
  const A=bodies[i],ra=radius(A);
  for(let j=i+1;j<bodies.length;j++){
   const B=bodies[j];
   if(Math.hypot(A.x-B.x,A.y-B.y)>ra+radius(B))continue;
   for(const c of collide(A,B)){c.A=A;c.B=B;cs.push(c);}
  }
  // ground
  if(A.t==="c"){
   if(A.y+A.r>GROUND)cs.push({A,B:GND,x:A.x,y:GROUND,nx:0,ny:1,d:A.y+A.r-GROUND});
  }else if(A.y+ra>GROUND){
   for(const v of verts(A))if(v.y>GROUND)cs.push({A,B:GND,x:v.x,y:v.y,nx:0,ny:1,d:v.y-GROUND});
  }
 }

 for(const c of cs){
  const {A,B}=c;
  c.rax=c.x-A.x;c.ray=c.y-A.y;c.rbx=c.x-B.x;c.rby=c.y-B.y;
  const rv=relVel(c),vn=rv[0]*c.nx+rv[1]*c.ny;
  c.bounce=-vn>200?.22*-vn:0;
  if(vn<0){dmg(A,B,-vn);dmg(B,A,-vn);}
  c.jn=0;c.jt=0;
  const tx=-c.ny,ty=c.nx;
  const n1=c.rax*c.ny-c.ray*c.nx,n2=c.rbx*c.ny-c.rby*c.nx;
  const t1=c.rax*ty-c.ray*tx,t2=c.rbx*ty-c.rby*tx;
  c.dn=A.im+B.im+n1*n1*A.ii+n2*n2*B.ii;
  c.dt=A.im+B.im+t1*t1*A.ii+t2*t2*B.ii;
 }
 for(let it=0;it<10;it++){
  for(const c of cs){
   let rv=relVel(c);
   let j=(-(rv[0]*c.nx+rv[1]*c.ny)+c.bounce)/c.dn;
   const nj=Math.max(0,c.jn+j);j=nj-c.jn;c.jn=nj;
   applyImp(c,j*c.nx,j*c.ny);
   rv=relVel(c);
   const tx=-c.ny,ty=c.nx;
   let jt=-(rv[0]*tx+rv[1]*ty)/c.dt;
   const mx=MU*c.jn,nt=clamp(c.jt+jt,-mx,mx);
   jt=nt-c.jt;c.jt=nt;
   applyImp(c,jt*tx,jt*ty);
  }
 }
 for(const c of cs){
  const k=Math.max(c.d-.4,0)*.45/(c.A.im+c.B.im);
  c.A.x-=c.nx*k*c.A.im;c.A.y-=c.ny*k*c.A.im;
  c.B.x+=c.nx*k*c.B.im;c.B.y+=c.ny*k*c.B.im;
 }

 for(const b of bodies){
  if(b.kind!=="rabbit"&&Math.hypot(b.vx,b.vy)<3&&Math.abs(b.av)<.05){b.vx=b.vy=b.av=0;continue;}
  b.x+=b.vx*STEP;b.y+=b.vy*STEP;b.a+=b.av*STEP;
  b.av*=.9995;
 }
 if(rb&&rb.y+rb.r>=GROUND-1){rb.vx*=.997;rb.av*=.985;}
}

/* ---------------- GAME FLOW ---------------- */
function game(){
 for(let i=bodies.length-1;i>=0;i--){
  const b=bodies[i];
  if(b.hp<=0){
   burst(b.x,b.y,b.kind==="hawk"?"#fff06a":"#e5c08a");
   score+=b.kind==="hawk"?100:10;updateUI();
   bodies.splice(i,1);
  }else if(b.y>H+150||b.x>W+400||b.x<-300)bodies.splice(i,1);
 }
 if(rb){
  rb.age+=STEP;
  const gone=!bodies.includes(rb);
  if(gone||rb.age>9||(rb.age>.6&&Math.hypot(rb.vx,rb.vy)<22&&rb.y+rb.r>=GROUND-2)){
   if(!gone){burst(rb.x,rb.y,"#fff");bodies.splice(bodies.indexOf(rb),1);}
   rb=null;wait=0;
  }
 }
 if(!rabbit&&!rb&&!won&&!gameOver){
  wait++;
  const hawksLeft=bodies.some(b=>b.kind==="hawk");
  if(!hawksLeft){
   if(wait>60){won=true;msg("🎉 Level cleared! Press Next Level!");}
  }else if(shots>0){
   if(wait>80){makeRabbit();msg("New rabbit ready! Take another shot.");}
  }else if(wait>150){
   gameOver=true;msg("Out of tries! Restart the level to try again.");
  }
 }
}

/* ---------------- FREE BACKGROUND PHOTOS ----------------
   Pulls public-domain / CC0 photos from Wikimedia Commons at runtime
   (one theme-matching photo per level). Falls back to the gradient. */
const bgQueries=["shiba inu dog","space nebula","city skyline","galaxy","empty office hallway","banana","pixel art","snowy mountain","city street","cat","rainbow","desert dunes","frog","ice cream","space station","jungle","volcano","candy","robot","underwater coral reef","haunted house","disco ball","clouds sky","lava flow","jellyfish","toys","neon city night","mushroom forest","moon surface","watermelon","beach volleyball","video arcade","crystal cave","snow forest","supermarket aisle","pirate ship","farm field","skate park","concert stage","lemon","abandoned arcade","dinosaur fossil","gummy bears","carnival fair","mountain peak","flower field","night forest","dreamy sunset sky","gold nuggets","dark castle"];
const bgCache={};
async function findBg(q){
 for(const term of [q+" public domain",q+" CC0",q]){
  const url="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=50&gsrsearch="+encodeURIComponent(term+" filetype:bitmap")+"&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=1000";
  const d=await (await fetch(url)).json();
  const ok=Object.values((d.query&&d.query.pages)||{}).map(p=>p.imageinfo&&p.imageinfo[0]).filter(i=>{
   const lic=i&&i.extmetadata&&i.extmetadata.LicenseShortName?i.extmetadata.LicenseShortName.value:"";
   return i&&i.thumburl&&/^(cc0|cc ?zero|public domain|pd)/i.test(lic);
  });
  if(ok.length)return ok[Math.floor(Math.random()*ok.length)];
 }
 throw new Error("none");
}
function loadBg(n){
 if(bgCache[n])return;
 bgCache[n]={state:"loading"};
 findBg(bgQueries[n-1]).then(i=>{
  const img=new Image();
  const m=i.extmetadata||{};
  const who=(m.Artist?m.Artist.value:"").replace(/<[^>]+>/g,"").trim().slice(0,40)||"Unknown";
  img.onload=()=>{bgCache[n]={state:"ok",img,credit:`Photo: ${who} (${m.LicenseShortName?m.LicenseShortName.value:"free"}) via Wikimedia Commons`};};
  img.onerror=()=>{bgCache[n]={state:"fail"};};
  img.src=i.thumburl;
 }).catch(()=>{bgCache[n]={state:"fail"};});
}
function drawCover(img){
 const k=Math.max(W/img.width,H/img.height),w=img.width*k,h=img.height*k;
 ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
}

/* ---------------- DRAWING ---------------- */
